# Keeps the free cloud API awake so the phone never waits for a cold start.
# Pings the public /health endpoint every ~10 minutes.
#
# SETUP (one-time): in GitHub → repo → Settings → Secrets and variables →
#   Actions → Variables → New variable:
#       Name:  API_HEALTH_URL
#       Value: https://<your-render-service>.onrender.com/health
# No secrets needed — /health is public.
name: keep-api-awake

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes (UTC)
  workflow_dispatch: {} # lets you run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          url="${{ vars.API_HEALTH_URL }}"
          if [ -z "$url" ]; then
            echo "Set repo variable API_HEALTH_URL first. Skipping."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$url" || echo 000)
          echo "GET $url -> HTTP $code"
          # Don't fail the workflow on a transient blip; the next run retries.
